<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Quizalia Pro - Game Show</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
    <link rel="stylesheet" href="style.css?v=3.2">
    <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>

<body>

    <h1>🎲 Quiz<span class="accent">alia</span> Pro</h1>

    <!-- HOME SECTION !!!! -->
    <section id="home">
        <div class="card">
            <h3>🎤 Host a Game</h3>
            <input type="text" id="hostName" placeholder="Host Name">
            <button id="createLobbyBtn">Create Lobby</button>
        </div>
        <div class="card">
            <h3>🎮 Join Game</h3>
            <input type="text" id="playerName" placeholder="Your Name">
            <input type="text" id="lobbyCodeInput" placeholder="Room Code">
            <button id="joinLobbyBtn">Join</button>
        </div>
    </section>

    <!-- LOBBY SECTION !!!! -->
    <section id="lobby" hidden>
        <div class="card">
            <h2>Room: <span id="lobbyCode">---</span></h2>

            <div class="card sound-card">
                <h3>🔔 Buzzer Sound</h3>
                <select id="buzzerSelect" class="custom-select">
                </select>
            </div>

            <canvas id="qrCode"></canvas>
            <ul id="playersList"></ul>
            <button id="startGameBtn" hidden>Start Game</button>
        </div>
    </section>

    <!-- GAME SECTION !!!! -->
    <section id="game" hidden>
        <div id="timerContainer" hidden>
            <div id="progressBarContainer">
                <div id="progressBar"></div>
            </div>
        </div>

        <!-- WHEEL OVERLAY -->
        <div id="slotMachineOverlay" hidden>
            <div class="slot-machine-wrap">
                <div id="slotReel" class="slot-reel">
                    <div class="slot-card"></div>
                    <div class="slot-card"></div>
                    <div class="slot-card"></div>
                    <div class="slot-card"></div>
                    <div class="slot-card"></div>
                </div>
            </div>
        </div>

        <!-- HOST VIEW -->
        <div id="hostView" hidden>
            <div class="theme-controls card">
                <button id="randomThemeBtn" disabled>🎰 Random Spin</button>
                <button id="selectThemeBtn" disabled>📂 Pick Theme</button>
                <button id="keepThemeBtn" class="btn-gm gray">🔁 Keep Last</button>
                <button id="manualModeBtn" class="btn-gm gray">⚡ Manual Buzzer</button>
                <p id="questionsStatus" class="status-text">Loading questions…</p>

                <div class="timer-separator"></div>
                <div class="timer-config">
                    <span>⏱️ Timer duration</span>
                    <select id="timeLimitSelect" class="neon-select">
                        <option value="5">5s</option>
                        <option value="10" selected>10s</option>
                        <option value="15">15s</option>
                        <option value="20">20s</option>
                        <option value="30">30s</option>
                        <option value="45">45s</option>
                        <option value="60">60s</option>
                    </select>
                </div>
            </div>

            <!-- THEME LIST MODAL -->
            <div id="themeListModal" hidden>
                <div id="themeButtonsContainer"></div>
            </div>

            <!-- GAME MASTER ACTION PANNEL -->
            <div id="gmActionPanel" class="card" hidden>
                <div id="activeWinnerName">---</div>
                <div class="gm-controls">
                    <button id="validateBtn" class="btn-gm green"><span class="icon">✓</span> CORRECT</button>
                    <button id="wrongBtn" class="btn-gm orange"><span class="icon">✕</span> WRONG</button>
                    <button id="resetRoundBtn" class="btn-gm gray">🔄 CLEAR / STOP</button>
                </div>
            </div>
        </div>

        <!-- FULL SCREEN CARD (filled by script.js when a question is selected) -->
        <div id="fullScreenCard" class="full-overlay" hidden></div>

        <!-- PLAYER VIEW -->
        <div id="playerView" hidden>
            <div id="themeHeaderFrame" class="theme-frame">
                <span class="theme-label">THEME:</span>
                <div id="playerThemeDisplayTop">Wait for Host...</div>
            </div>

            <div id="whoBuzzed" class="buzzer-announcement"></div>

            <div class="settings-mini">
                <select id="buzzerSelectPlayer" class="custom-select"></select>
            </div>

            <button id="buzzBtn">BUZZ !</button>
        </div>
    </section>

    <script type="module" src="script.js?v=3.2"></script>
</body>

</html>
